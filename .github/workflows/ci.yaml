# CI for Product Catalog Service

name: product-catalog-ci

on:
    pull_request:
        branches:
        - main

# Least privilege by default. Only updatek8s writes to the repository, so it
# raises its own permission rather than every job inheriting write access to
# the source, which build, lint and image publishing have no need for.
permissions:
    contents: read

env:
    # Tag images by the commit that produced them, not by github.run_id.
    #
    # run_id changes on every run, including a plain re-run of unchanged code,
    # so the manifest was rewritten and committed every single time - six such
    # commits accumulated on one branch. A content-derived tag makes the whole
    # step idempotent: same code, same tag, no diff, no commit.
    #
    # head.sha rather than github.sha: on a pull_request event github.sha is
    # the ephemeral refs/pull/N/merge commit, which is not the code being
    # shipped and does not exist after the PR closes. The fallback keeps this
    # correct if a push trigger is ever added.
    IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - name: checkout code
          uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        - name: Setup Go
          uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
          with:
            go-version: "1.25"
            # go.sum lives in the service directory, not the repo root, so the
            # default '**/go.sum' lookup misses and every run warns
            # "Restore cache failed" then rebuilds the module cache from scratch.
            cache-dependency-path: src/product-catalog/go.sum
        
        - name: Build
          run: |
            cd src/product-catalog
            go mod download
            go build -o product-catalog-service main.go

        - name: unit tests
          run: |
            cd src/product-catalog
            # -v so the log names each test. Without it a passing run prints a
            # single "ok" line, which is indistinguishable from a package that
            # contains no tests at all - which is what this stage used to be.
            go test -v ./...
    
    code-quality:
        runs-on: ubuntu-latest

        steps:
        - name: checkout code
          uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        
        - name: Setup Go
          uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
          with:
           go-version: "1.25"
           cache-dependency-path: src/product-catalog/go.sum

        - name: Run golangci-lint
          uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
          with:
            # v1.55.2 was built against Go 1.21 and cannot compile a
            # `go 1.25.0` module - it exits 3 before reporting a single issue.
            # The linter's own toolchain has to keep pace with the code's.
            version: v2.12.2
            working-directory: src/product-catalog

    docker:
        runs-on: ubuntu-latest

        # Gate on lint as well as build, so a red code-quality job cannot
        # ship an image.
        needs: [build, code-quality]

        permissions:
            contents: read
            # Mints the short-lived OIDC token cosign exchanges for a signing
            # certificate. This is what makes keyless signing possible: no
            # private key is generated, stored, or rotated anywhere.
            id-token: write

        steps:
        - name: checkout code
          uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        # Registers binfmt handlers so buildx can emit non-native architectures.
        - name: Set up QEMU
          uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

        - name: Install Docker
          uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

        - name: Login to Docker
          uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Docker Push
          id: build
          uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
          with:
            context: src/product-catalog
            file: src/product-catalog/Dockerfile
            push: true
            # arm64 is not optional: the demo runs on k3s on an Oracle Ampere
            # A1 instance. An amd64-only image fails there with
            # "exec format error" after the pull appears to succeed.
            platforms: linux/amd64,linux/arm64
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/product-catalog:${{ env.IMAGE_TAG }}
            # Layer cache in the registry, so the second architecture and
            # subsequent runs reuse work instead of rebuilding from scratch.
            cache-from: type=gha
            cache-to: type=gha,mode=max
            # Ship an SBOM and build provenance with the image, so what is
            # inside it can be audited after the fact rather than guessed at.
            sbom: true
            provenance: mode=max

        # Scans the image that was actually published, not the source tree, so
        # base-image CVEs are covered too - alpine ships a libc and busybox
        # that no Go dependency scanner would ever look at.
        - name: Scan image for vulnerabilities
          uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
          with:
            image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/product-catalog:${{ env.IMAGE_TAG }}
            format: table
            severity: HIGH,CRITICAL
            # Fail the job on findings, but only those with a fix available.
            # Gating on unfixable CVEs would block every release on something
            # no action can resolve, which trains people to ignore the gate.
            ignore-unfixed: true
            exit-code: '1'

        - name: Install cosign
          uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
          with:
            # Pinned to v2.x deliberately. cosign v3 defaults
            # --new-bundle-format to true, which publishes the signature
            # through the OCI 1.1 referrers API; Docker Hub accepts that write
            # but does not serve the referrer back, so verification reports
            # "no signatures found" for an image that signed successfully.
            # Setting the flag to false is not a way out either - v3 then
            # errors with "must provide --new-bundle-format or --bundle ...
            # with --signing-config". v2 writes a plain sha256-<digest>.sig
            # tag, which every registry serves.
            cosign-release: v2.6.4

        # Signs by digest, never by tag. A tag is mutable and can be repointed
        # at a different image; the digest is the content address of the exact
        # bytes that were scanned above.
        - name: Sign image
          env:
            IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/product-catalog
            DIGEST: ${{ steps.build.outputs.digest }}
          run: cosign sign --yes "${IMAGE}@${DIGEST}"

        # Signing without verifying only proves the command exited 0. This
        # asserts the signature is attributable to this workflow, on this
        # repository, issued by GitHub's OIDC provider - the properties a
        # consumer would actually check.
        - name: Verify signature
          env:
            IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/product-catalog
            DIGEST: ${{ steps.build.outputs.digest }}
          run: |
            cosign verify "${IMAGE}@${DIGEST}" \
              --new-bundle-format=false \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

    
    updatek8s:
        runs-on: ubuntu-latest

        needs: docker

        # The only job that commits back to the branch.
        permissions:
            contents: write

        steps:
        - name: checkout code
          uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
          with:
            # Check out the PR branch itself, not the ephemeral merge ref.
            # Without this, HEAD is refs/pull/N/merge and pushing it rewrites history.
            ref: ${{ github.head_ref }}
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: Update tag in kubernetes deployment manifest
          run: |
               sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/product-catalog:${{ env.IMAGE_TAG }}|" kubernetes/productcatalog/deploy.yaml

        - name: Commit and push changes
          run: |
            git config --global user.email "vhoraarsh87@gmail.com"
            git config --global user.name "ARSH871-bot"
            git add kubernetes/productcatalog/deploy.yaml
            if git diff --cached --quiet; then
              echo "Image tag unchanged, nothing to commit"
              exit 0
            fi
            git commit -m "[CI]: Update product catalog image tag"
            git push origin HEAD:${{ github.head_ref }}

        
        
          


        