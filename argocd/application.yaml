---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astronomy-shop
  namespace: argocd
  annotations:
    # Argo CD Image Updater replaces the sed-and-commit step CI used to run.
    # It watches Docker Hub directly, so nothing has to push to a protected
    # branch. write-back-method: argocd stores the resolved image on the
    # Application rather than committing to git, which keeps main clean and
    # avoids the bot-commit-blocks-required-checks problem entirely.
    argocd-image-updater.argoproj.io/image-list: >-
      productcatalog=arsh885/product-catalog
    argocd-image-updater.argoproj.io/productcatalog.update-strategy: digest
    argocd-image-updater.argoproj.io/productcatalog.allow-tags: any
    argocd-image-updater.argoproj.io/write-back-method: argocd
  finalizers:
    # Makes deleting the Application also delete what it deployed, instead of
    # orphaning 38 resources in the cluster.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devopsbyarsh

  source:
    repoURL: https://github.com/ARSH871-bot/devopsbyarsh-shop.git
    # main, not the PR branch. CI writes the image tag to the PR branch, so the
    # tag reaches main only once the PR merges - review stays in the path to
    # production.
    targetRevision: main
    # The k3s overlay, which is what serves devopsbyarsh.shop. Argo detects the
    # kustomization.yaml and renders it; no directory.recurse or exclude is
    # needed, because the base lists its resources explicitly and therefore
    # never picks up complete-deploy.yaml.
    #
    # Point this at overlays/eks to deploy the AWS-native path
    # instead. Nothing else in this Application changes.
    path: overlays/k3s

  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-demo

  syncPolicy:
    automated:
      # Delete resources removed from git, rather than leaving them behind.
      prune: true
      # Revert manual kubectl edits back to what git says.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Keeps the last-applied annotation off resources that are already large.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  # Enough history to roll back a bad image tag, not so much that the CRD grows
  # without bound.
  revisionHistoryLimit: 10
