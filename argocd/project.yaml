---
# Scopes what this Argo CD project is allowed to deploy, and where.
# Without an AppProject every Application lands in "default", which permits any
# repo to any cluster and any namespace.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: devopsbyarsh
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: OpenTelemetry Astronomy Shop - devopsbyarsh.shop

  # Only this repository may be synced by Applications in this project.
  sourceRepos:
    - https://github.com/ARSH871-bot/devopsbyarsh-shop.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: opentelemetry-demo

  # ClusterIssuer is the only cluster-scoped object the demo needs: cert-manager
  # uses it to issue the Let's Encrypt certificate in the k3s overlay. Anything
  # else cluster-scoped - a stray ClusterRole or CRD - is refused rather than
  # applied.
  clusterResourceWhitelist:
    - group: cert-manager.io
      kind: ClusterIssuer

  namespaceResourceWhitelist:
    - group: ''
      kind: '*'
    - group: apps
      kind: '*'
    - group: networking.k8s.io
      kind: '*'
    # Traefik Middleware, for the HTTP to HTTPS redirect on k3s.
    - group: traefik.io
      kind: '*'
