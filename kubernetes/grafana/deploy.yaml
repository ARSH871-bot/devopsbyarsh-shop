---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-grafana
  labels:
    opentelemetry.io/name: opentelemetry-demo-grafana
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: grafana
    app.kubernetes.io/name: opentelemetry-demo-grafana
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      opentelemetry.io/name: opentelemetry-demo-grafana
  template:
    metadata:
      labels:
        opentelemetry.io/name: opentelemetry-demo-grafana
        app.kubernetes.io/instance: opentelemetry-demo
        app.kubernetes.io/component: grafana
        app.kubernetes.io/name: opentelemetry-demo-grafana
    spec:
      serviceAccountName: opentelemetry-demo
      containers:
        - name: grafana
          image: grafana/grafana:12.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            # Envoy serves Grafana under /grafana. Without these three it
            # renders but every asset and redirect 404s.
            - name: GF_SERVER_DOMAIN
              value: devopsbyarsh.shop
            - name: GF_SERVER_ROOT_URL
              value: "https://devopsbyarsh.shop/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            # Public demo: visitors get read-only dashboards without a login
            # prompt. Admin still requires credentials.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "false"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: datasources
          configMap:
            name: opentelemetry-demo-grafana-datasources
