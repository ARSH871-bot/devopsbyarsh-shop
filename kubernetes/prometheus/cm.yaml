---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-demo-prometheus-server
  labels:
    opentelemetry.io/name: opentelemetry-demo-prometheus-server
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/name: opentelemetry-demo-prometheus-server
    app.kubernetes.io/part-of: opentelemetry-demo
data:
  # Deliberately no scrape_configs. Metrics arrive by OTLP push from the
  # collector's otlphttp/prometheus exporter, so there is nothing to pull.
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 30s
